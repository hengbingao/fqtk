[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fastq-toolkit"
version = "0.3.1"
description = "Length-based FASTQ trimming and read-length statistics for single-end/paired-end sequencing data"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [{name = "Hengbin Gao"}]

[project.scripts]
fqtk = "fastq_toolkit.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
